; Linphone <-> Twilio bridge. Managed from ~/Workspace/twilio/linphone.

[linphone-out]
; a number dialled in the phone app goes out through Twilio (the Twilio Function adds the caller ID)
exten => _+X.,1,NoOp(Linphone is calling ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@twilio,90)
 same => n,Hangup()
exten => _X.,1,NoOp(Linphone is calling ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@twilio,90)
 same => n,Hangup()

[twilio-in]
; a call to the Twilio number rings every device logged in as abrar
exten => abrar,1,NoOp(Call from ${CALLERID(num)})
 same => n,Dial(${PJSIP_DIAL_CONTACTS(abrar)},30)
 same => n,Hangup()
exten => s,1,Goto(abrar,1)
exten => _[+0-9].,1,Goto(abrar,1)

[linphone-sms]
; a chat message typed in the phone app is handed to sms_bridge.py, which sends it as an SMS
exten => _[+0-9].,1,NoOp(Linphone sends an SMS to ${EXTEN})
 same => n,UserEvent(LinphoneSms,To: ${EXTEN},Body64: ${BASE64_ENCODE(${MESSAGE(body)})})
 same => n,Hangup()
